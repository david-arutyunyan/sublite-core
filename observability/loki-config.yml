# Minimal single-binary Loki, filesystem storage - no separate object
# store needed for a local/portfolio setup. retention_period is the whole
# point of this file: without compactor.retention_enabled, Loki keeps
# data forever regardless of what limits_config says.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h # 30 days

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
