spring:
  application:
    name: sublite-core

  datasource:
    url: jdbc:postgresql://localhost:5432/sublite
    username: sublite
    password: sublite

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    schemas: shared,subscription,billing,retention,loyalty
    default-schema: shared

  data:
    redis:
      host: localhost
      port: 6379

sublite:
  billing:
    scheduler:
      interval: PT1M
    retry:
      base-interval: P1D
      max-attempts: 3
  retention:
    flow-cache:
      ttl: PT5M
  security:
    jwt:
      # Dev-only default (32 random bytes, base64). A real deployment
      # overrides this via SUBLITE_JWT_SECRET - the signing key must never
      # live in version control outside a throwaway dev value like this.
      secret: ${SUBLITE_JWT_SECRET:fvlE+/417VRbYBny6GOmpe9X0QgMb++GOqHh6/xbE8I=}
      issuer: sublite-core
      access-token-ttl: PT1H
