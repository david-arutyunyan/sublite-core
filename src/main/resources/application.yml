spring:
  application:
    name: sublite-core

  threads:
    virtual:
      # Every request handler here blocks on I/O at some point - JDBC to
      # Postgres, a Jedis/Lettuce call to Redis, RandomPaymentGateway's
      # simulated provider latency - never on CPU-bound work. That's
      # exactly the case virtual threads help: Tomcat can park a virtual
      # thread on a blocking call almost for free and keep serving other
      # requests, instead of one platform thread (expensive, OS-backed)
      # sitting idle per in-flight request. No code changes needed
      # elsewhere - the same blocking JDBC/Jedis calls just run on a
      # virtual thread now.
      enabled: true

  # Host/port/credentials come from env vars (12-factor: where to connect
  # is deployment config, not a profile) - defaults are for local dev
  # against docker-compose.yml's plain postgres/redis services. The
  # `docker` profile (application-docker.yml) is reserved for behavior
  # toggles like log format, not connectivity.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sublite}
    username: ${DB_USER:sublite}
    password: ${DB_PASSWORD:sublite}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    schemas: shared,subscription,billing,retention,loyalty
    default-schema: shared

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        # Deliberately not "*": /actuator/env, /actuator/beans etc. can
        # leak configuration (including secrets) and aren't needed for
        # this project's observability story.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Registers /actuator/health/liveness and /actuator/health/readiness
      # groups - readiness includes the DB/Redis health indicators,
      # liveness doesn't (matches what a k8s liveness vs readiness probe
      # should each check). See HealthController for the older, simpler
      # /health that predates this and still exists for compatibility.
      probes:
        enabled: true
      # Anonymous callers (docker/k8s health checks) get UP/DOWN only;
      # an ADMIN-authenticated caller sees the full breakdown (DB pool,
      # disk space, Redis) - same reasoning as gating /admin/**, this is
      # operational detail, not something to hand out for free.
      show-details: when-authorized
      roles: ADMIN

logging:
  pattern:
    # console and file are separate properties in Boot - setting only
    # the former leaves the file appender on Boot's own default pattern,
    # without correlationId. Same pattern for both here on purpose.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"
    file: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"
  # File output for local runs without Docker (`./mvnw spring-boot:run`) -
  # something to grep/tail after the fact instead of only having whatever
  # is still in the terminal's scrollback. Turned back off in the
  # `docker` profile (application-docker.yml): a container's filesystem
  # is disposable, and writing a log file nobody reads inside it would
  # contradict the stdout-only, 12-factor logging this project already
  # commits to for `docker compose` (see README).
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

sublite:
  billing:
    scheduler:
      interval: PT1M
    retry:
      base-interval: P1D
      max-attempts: 3
  retention:
    flow-cache:
      ttl: PT5M
  security:
    jwt:
      # Dev-only default (32 random bytes, base64). A real deployment
      # overrides this via SUBLITE_JWT_SECRET - the signing key must never
      # live in version control outside a throwaway dev value like this.
      secret: ${SUBLITE_JWT_SECRET:fvlE+/417VRbYBny6GOmpe9X0QgMb++GOqHh6/xbE8I=}
      issuer: sublite-core
      access-token-ttl: PT1H
